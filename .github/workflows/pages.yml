name: Publicar LAPELC²
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/**'
      - 'i18n/**'
      - 'scripts/build-english.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lapelc-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar arquivos do website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          node scripts/build-english.mjs
          cp ./*.html _site/
          cp -a en _site/
          cp -a assets _site/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/en/index.html
          test -f _site/en/research.html
          test -f _site/en/people.html
          test -f _site/eeg.html
          test -f _site/pessoas.html
          test -f _site/assets/site.css
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

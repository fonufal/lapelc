name: Verificação visual e responsiva do LAPELC²
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/**'
      - 'i18n/**'
      - 'scripts/build-english.mjs'
      - 'scripts/qa-browser.mjs'
      - '.github/workflows/qa-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegadores Chromium e WebKit (Safari)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Gerar páginas em inglês
        run: node scripts/build-english.mjs
      - name: Iniciar servidor local
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/lapelc-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verificar páginas em Chromium e setas em WebKit
        run: node scripts/qa-browser.mjs
      - name: Guardar capturas e relatório de QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lapelc-qa-browser
          path: artifacts/qa/
          if-no-files-found: warn
